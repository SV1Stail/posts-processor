# local
  posts-processor:
    container_name: posts-processor
    build: 
      context: .
      dockerfile: ./local/docker/Dockerfile
    restart: always
    ports:
      - 6090:8090 # gRPC
      - 6091:8080 # HTTP
    volumes:
      - "./local/bin:/opt/bin"
      - "./local/etc:/opt/etc"
    entrypoint: ["/opt/bin/posts-processor"]
    environment:
      DATABASE_DSN: "postgres://postgres:postgres@db-posts-processor:5432/posts_processor?sslmode=disable"
      GRPC_PORT: "8090"
      QUEUE_SCHEDULER_ADDR: "queue-scheduler:8090"
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8090"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

