services:
  db:
    container_name: db-posts-processor
    image: postgres:17.10-alpine3.23
    restart: always
    hostname: db
    environment:
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "posts_processor"
    ports:
      - "6432:5432"
    volumes:
      - "postgres_volume:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    container_name: migrator-posts-processor
    build: 
      context: .
      dockerfile: build/docker/migrate/postgres/Dockerfile
    environment:
      POSTGRES_HOST: db-posts-processor
      POSTGRES_DB: posts_processor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

